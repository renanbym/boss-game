<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Sin Dragon</title>

    <style>
        body {
            background: #262626;
            overflow: hidden;
        }

        canvas {
            border: solid 0.5px rgb(33, 33, 33);
            display: block;
            margin: 0 auto;
        }

        .control {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        button{
            display: block;
            height: 50px;
        }

    </style>

    <script src="grid.js"></script>
    <script src="findPath.js"></script>
    <script src="Teclado.js"></script>
    <script src="Background.js"></script>
    <script src="Personagem.js"></script>
</head>

<body>

    <canvas width="1000" height="1000" id="container"></canvas>

    <div class="control">
        <button id="add-villain">Add Villain</button>
    </div>

    <script>



        const canvas = document.getElementById('container')
        const context = canvas.getContext('2d', { stencil: true, preserveDrawingBuffer: false })

        const PIXEL = 40;


        const BG = new Background({ canvas, context, MAP, images: ['img/bgs.png', 'img/walls.png'], PIXEL })

        const Gunslinger = new Personagem({ name: 'primeiro', width: 49, height: 48, WORLD, context, image: 'img/actor.png', PIXEL })
        Teclado.call(Gunslinger, WALLS, PIXEL);


        /**
         * Animação de explosão a partir de uma spritesheet em grade.
         * Ainda não é usada; fica para o ataque da Fase 3.
         */
        class Explosao {

            line = 1
            column = 1
            maxLine = 5
            maxColumn = 5

            lastTime = new Date().getTime();
            intervalo = 0


            image = new Image();

            /**
             * @param {Object} options
             * @param {number} options.x Posição x, em pixels.
             * @param {number} options.y Posição y, em pixels.
             * @param {number} options.width Largura do quadro, em pixels.
             * @param {number} options.height Altura de desenho, em pixels.
             * @param {CanvasRenderingContext2D} options.context Contexto de desenho.
             * @param {string} options.image Caminho da spritesheet.
             */
            constructor() {
                this.params(arguments[0])
            }

            /**
             * Copia as opções do construtor para a instância e carrega a imagem.
             * @param {Object} options Mesmas opções aceitas pelo construtor.
             */
            params = ({ x, y, width, height, context, image }) => {
                this.context = context

                this.width = width
                this.height = height
                this.x = x
                this.y = y

                this.image = new Image()
                this.image.src = image
            }

            /**
             * Avança para o próximo quadro da explosão, respeitando `intervalo`.
             */
            nextFrame = () => {
                const now = new Date().getTime();

                this.line = this.line >= this.maxLine ? 0 : ++this.line;
                this.column = this.column >= this.maxColumn ? 0 : ++this.column;

                if (!this.lastTime) this.lastTime = now;

                if (now - this.lastTime < this.intervalo) return;

                this.lastTime = now;
            }

            /**
             * Desenha o quadro atual.
             */
            render = () => {
                this.context.drawImage(this.image, this.line * this.width, this.column * this.width, this.width, this.width, this.x, this.y, this.width, this.height)
            }

        }

        /**
         * Loop principal: desenha fundos, personagens e frentes a cada frame.
         */
        class BossGame {

            backgrounds = [];
            foregrounds = []
            players = []
            frameId = null

            /**
             * Remove um personagem da cena.
             * @param {Personagem} player
             */
            removePlayer = (player) => {
                this.players = this.players.filter(cur => cur != player)
            }

            /**
             * Adiciona um personagem à cena.
             * @param {Personagem} player
             */
            addPlayer = (player) => {
                this.players.push(player)
            }

            /**
             * Remove uma camada de fundo.
             * @param {{render: Function}} background
             */
            removeBackground = (background) => {
                this.backgrounds = this.backgrounds.filter(cur => cur != background)
            }

            /**
             * Adiciona uma camada de fundo, desenhada antes dos personagens.
             * @param {{render: Function}} background
             */
            addBackground = (background) => {
                this.backgrounds.push(background)
            }

            /**
             * Remove uma camada de frente.
             * @param {{render: Function}} foreground
             */
            removeForeground = (foreground) => {
                this.foregrounds = this.foregrounds.filter(cur => cur != foreground)
            }

            /**
             * Adiciona uma camada de frente, desenhada depois dos personagens.
             * @param {{render: Function}} foreground
             */
            addForeground = (foreground) => {
                this.foregrounds.push(foreground)
            }

            /**
             * Desenha um frame e agenda o próximo.
             * Antes de desenhar, tira da cena quem morreu e vilões cujo alvo morreu.
             */
            render = () => {
                this.players = this.players.filter(player =>
                    player.live && !(player.walkingTo && !player.walkingTo.live)
                )

                this.backgrounds.forEach(bg => bg.render());
                this.players.forEach(player => player.render());
                this.foregrounds.forEach(fg => fg.render());

                this.frameId = window.requestAnimationFrame(this.render);
            }

            /**
             * Inicia o loop, se ainda não estiver rodando.
             */
            start = () => {
                if (this.frameId !== null) return
                this.frameId = window.requestAnimationFrame(this.render);
            }

            /**
             * Para o loop.
             */
            stop = () => {
                window.cancelAnimationFrame(this.frameId)
                this.frameId = null
            }

        }

        const game = new BossGame();
        game.addBackground(BG);
        game.start()
        game.addPlayer(Gunslinger);


        document.querySelector('#add-villain').addEventListener('click', () => {
            const Villain = new Personagem({ name: 'segundo', width: 49, height: 48, WORLD, PIXEL, velocity: 250, context, image: 'img/Villager1.png', walkingTo: Gunslinger, villain: true })
            game.addPlayer(Villain);
        })

    </script>

</body>

</html>
